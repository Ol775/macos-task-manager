name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: ./build-app.sh
      - name: Self-test
        run: TaskManager.app/Contents/MacOS/TaskManager --selftest
      # Tagged builds also pack a DMG. It is only kept as a workflow artifact: the signed DMG on the release is
      # made offline (./release.sh) and must not be replaced, or the in-app updater would reject it.
      # (Single-architecture here: the runner's Xcode can't do the universal build that release.sh does locally.)
      - name: DMG
        if: startsWith(github.ref, 'refs/tags/v')
        run: UNIVERSAL= ./make-dmg.sh
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: unsigned-dmg
          path: dist/*.dmg
