name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build-app.sh
      - name: Self-test
        run: TaskManager.app/Contents/MacOS/TaskManager --selftest
      # Tagged builds also pack a universal DMG. It is only kept as a workflow artifact: the signed DMG on the release is
      # made offline (./release.sh) and must not be replaced, or the in-app updater would reject it.
      - name: Universal DMG
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./make-dmg.sh
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: unsigned-dmg
          path: dist/*.dmg
